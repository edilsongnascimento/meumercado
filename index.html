<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#16a34a">

    <meta
        name="mobile-web-app-capable"
        content="yes">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes">

    <title>Meu Mercado</title>

    <link
        rel="manifest"
        href="./manifest.json">

    <link
        rel="stylesheet"
        href="./style.css">

</head>

<body>

    <!-- ============================= -->
    <!-- CABEÇALHO -->
    <!-- ============================= -->

    <header class="topo">

        <div>

            <h1>🛒 Meu Mercado</h1>

            <p>
                Controle suas compras e preços
            </p>

        </div>

        <button
            class="btn-principal btn-primario btn-header-action"
            onclick="abrirCadastro()">

            ＋ Produto

        </button>

    </header>


    <!-- ============================= -->
    <!-- CONTEÚDO -->
    <!-- ============================= -->

    <main class="conteudo">

        <div id="telaLista" class="tela ativa">

            <!-- PESQUISA -->

            <section class="barra-acoes">

                <input
                    type="search"
                    id="pesquisa"
                    class="pesquisa"
                    placeholder="🔎 Pesquisar produto..."
                    oninput="mostrarProdutos()">

                <button
                    class="btn-scanner btn-primario btn-icon"
                    onclick="abrirScanner()">

                    📷

                </button>

            </section>


            <!-- RESUMO -->

            <section class="resumo">

                <div class="resumo-item">

                    <strong id="totalProdutos">
                        0
                    </strong>

                    <span>
                        Produtos
                    </span>

                </div>


                <div class="resumo-item">

                    <strong id="totalComprados">
                        0
                    </strong>

                    <span>
                        Comprados
                    </span>

                </div>

            </section>


            <!-- LISTA DE PRODUTOS -->

            <section class="lista-area">

                <div class="titulo-lista">

                    <h2>Minha lista de compras</h2>

                </div>

                <div id="listaProdutos">

                    Nenhum produto cadastrado.

                </div>

            </section>

        </div>


        <section id="telaCadastro" class="tela cadastro-screen">

            <div class="cadastro-topo">

                <button
                    type="button"
                    class="btn-voltar"
                    onclick="fecharCadastro()">

                    ← Voltar

                </button>

                <h2>Cadastro de produto</h2>

            </div>

            <div class="cadastro-card">

                <label for="nomeProduto">
                    Nome do produto
                </label>

                <input
                    type="text"
                    id="nomeProduto"
                    placeholder="Ex.: Arroz 5kg">

                <label for="categoriaProduto">
                    Categoria
                </label>

                <select id="categoriaProduto">

                    <option value="Açougue">🥩 Açougue</option>
                    <option value="Aves">🐔 Aves</option>
                    <option value="Peixaria">🐟 Peixaria</option>
                    <option value="Hortifruti">🥬 Hortifruti</option>
                    <option value="Laticínios">🥛 Laticínios</option>
                    <option value="Ovos">🥚 Ovos</option>
                    <option value="Padaria">🍞 Padaria</option>
                    <option value="Mercearia" selected>🥫 Mercearia</option>
                    <option value="Massas e grãos">🍝 Massas e grãos</option>
                    <option value="Bebidas">🥤 Bebidas</option>
                    <option value="Congelados">🧊 Congelados</option>
                    <option value="Frios e embutidos">🥓 Frios e embutidos</option>
                    <option value="Chocolates e doces">🍫 Chocolates e doces</option>
                    <option value="Biscoitos e snacks">🍪 Biscoitos e snacks</option>
                    <option value="Cafés e matinais">☕ Cafés e matinais</option>
                    <option value="Temperos e condimentos">🧂 Temperos e condimentos</option>
                    <option value="Enlatados e conservas">🥫 Enlatados e conservas</option>
                    <option value="Higiene pessoal">🧴 Higiene pessoal</option>
                    <option value="Limpeza">🧹 Limpeza</option>
                    <option value="Papelaria e descartáveis">🧻 Papelaria e descartáveis</option>
                    <option value="Bebês">👶 Bebês</option>
                    <option value="Pet shop">🐶 Pet shop</option>
                    <option value="Produtos naturais">🌿 Produtos naturais</option>
                    <option value="Utilidades domésticas">🏠 Utilidades domésticas</option>
                    <option value="Lavanderia">🧺 Lavanderia</option>
                    <option value="Perfumaria">🧴 Perfumaria</option>
                    <option value="Outros">📦 Outros</option>
                </select>

                <div class="nova-categoria">
                    <input
                        type="text"
                        id="nomeNovaCategoria"
                        maxlength="40"
                        placeholder="Nome da nova categoria"
                        aria-label="Nome da nova categoria">
                    <button
                        type="button"
                        class="btn-adicionar-categoria"
                        onclick="adicionarCategoria()">
                        + Categoria
                    </button>
                </div>

                <label for="codigoBarras">
                    Código de barras <small>(opcional)</small>
                </label>

                <div class="campo-codigo-barras">

                    <input
                        type="text"
                        id="codigoBarras"
                        inputmode="numeric"
                        placeholder="Digite ou leia o código">

                    <button
                        type="button"
                        class="btn-ler-codigo"
                        onclick="abrirScanner()">
                        📷 Ler
                    </button>

                </div>

                <label for="ultimoPreco">Último preço</label>
                <input type="number" id="ultimoPreco" step="0.01" min="0" placeholder="0,00">

                <label for="precoAtual">Preço atual</label>
                <input type="number" id="precoAtual" step="0.01" min="0" placeholder="0,00">

                <div class="modal-botoes">
                    <button type="button" class="btn-cancelar btn-secundario" onclick="fecharCadastro()">Cancelar</button>
                    <button type="button" class="btn-salvar btn-primario" onclick="salvarNovoProduto()">💾 Salvar produto</button>
                </div>

            </div>

        </section>

    </main>

    <nav class="rodape-navegacao" aria-label="Navegação principal">

        <button class="nav-item active" type="button" onclick="mostrarTela('lista')">
            🛒 Lista
        </button>

        <button class="nav-item" type="button" onclick="abrirCadastro()">
            ＋ Novo
        </button>

        <button class="nav-item" type="button" onclick="mostrarTela('produtos')">
            📦 Produtos
        </button>

    </nav>

    <!-- ================================================= -->
    <!-- MODAL - ALTERAR PREÇO -->
    <!-- ================================================= -->

    <div
        id="modalPreco"
        class="modal oculto">

        <div class="modal-conteudo">


            <div class="modal-cabecalho">

                <h2>
                    Alterar preço
                </h2>

                <button
                    class="btn-fechar"
                    onclick="fecharPreco()">

                    ×

                </button>

            </div>


            <p id="nomeProdutoPreco"></p>


            <label for="novoPreco">

                Novo preço

            </label>

            <input
                type="number"
                id="novoPreco"
                step="0.01"
                min="0"
                placeholder="0,00">


            <div class="modal-botoes">

                <button
                    type="button"
                    class="btn-cancelar btn-secundario"
                    onclick="fecharPreco()">

                    Cancelar

                </button>


                <button
                    type="button"
                    class="btn-salvar btn-primario"
                    onclick="salvarNovoPreco()">

                    Salvar preço

                </button>

            </div>

        </div>

    </div>



    <!-- ================================================= -->
    <!-- MODAL - LEITOR DE CÓDIGO DE BARRAS -->
    <!-- ================================================= -->

    <div
        id="modalScanner"
        class="modal oculto">

        <div
            class="modal-conteudo scanner-conteudo">


            <div class="modal-cabecalho">

                <h2>
                    📷 Ler código de barras
                </h2>

                <button
                    class="btn-fechar"
                    onclick="fecharScanner()">

                    ×

                </button>

            </div>


            <div class="area-camera">

                <video
                    id="videoScanner"
                    autoplay
                    muted
                    playsinline>
                </video>


                <div class="mira-scanner"></div>

            </div>


            <p
                id="statusScanner"
                class="status-scanner">

                Aponte a câmera para o código de barras.

            </p>


            <button
                type="button"
                class="btn-cancelar btn-secundario btn-fechar-camera"
                onclick="fecharScanner()">

                Fechar câmera

            </button>

        </div>

    </div>



    <!-- ================================================= -->
    <!-- APLICAÇÃO -->
    <!-- ================================================= -->

    <script src="./app.js"></script>


</body>

</html>
